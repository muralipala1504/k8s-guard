[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "k8s-guard"
version = "0.1.0"
description = "Autonomous Kubernetes Agent - Auto-heal, Scale, Optimize"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "kubernetes>=28.1.0",
    "gradio>=4.26.0",
    "sqlalchemy>=2.0.25",
    "slack-sdk>=3.27.0",
    "pyyaml>=6.0.1",
    "click>=8.1.7",
    "rich>=13.7.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
k8s-guard = "k8s_guard.main:cli"
